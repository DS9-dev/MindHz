name: CI

on:
  push:
    branches: ['**']
    tags-ignore: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Typecheck & tests (Linux)
    runs-on: ubuntu-latest
    permissions:
      contents: write # only used to commit a freshly generated lockfile (bootstrap)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        shell: bash
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install --no-audit --no-fund; fi
      - name: Commit generated lockfile (bootstrap only)
        if: github.event_name == 'push' && !startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          if [ -n "$(git status --porcelain package-lock.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add package-lock.json
            git commit -m "chore: add generated package-lock.json"
            git push
          fi
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  windows:
    name: Windows x64 build + smoke test
    runs-on: windows-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        shell: bash
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install --no-audit --no-fund; fi
      - run: npm test
      - run: npm run pack:win
      - name: Smoke test (unpacked app)
        run: npm run smoke -- --exe "release/win-unpacked/MindHz.exe" --out smoke-output
      - name: Upload smoke report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-windows
          path: smoke-output/**/*.json
          if-no-files-found: ignore
